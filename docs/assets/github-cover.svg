<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Liga App Mundial 2026 final archive</title>
  <desc id="desc">Final project cover for a private World Cup Pick'em app with winner Pablin Yamal and tournament stats.</desc>
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 60) rotate(45) scale(980 720)">
      <stop stop-color="#00D9FF" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#7C3AED" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#07111F"/>
    </radialGradient>
    <linearGradient id="line" x1="88" y1="118" x2="1112" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9FF"/>
      <stop offset="0.52" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="pill" x1="742" y1="396" x2="1066" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00D9FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="cardShadow" x="50" y="38" width="1100" height="554" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#000814" flood-opacity="0.62"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#050B14"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.22">
    <circle cx="1012" cy="110" r="180" stroke="#00D9FF" stroke-width="1"/>
    <circle cx="1058" cy="486" r="240" stroke="#7C3AED" stroke-width="1"/>
    <circle cx="120" cy="520" r="190" stroke="#F59E0B" stroke-width="1"/>
  </g>
  <g filter="url(#cardShadow)">
    <rect x="72" y="58" width="1056" height="514" rx="36" fill="#0B1424" fill-opacity="0.92"/>
    <rect x="72.75" y="58.75" width="1054.5" height="512.5" rx="35.25" stroke="#23304A" stroke-width="1.5"/>
  </g>
  <rect x="88" y="116" width="1024" height="2" fill="url(#line)"/>
  <text x="104" y="108" fill="#8FB6FF" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="5">PRIVATE TOURNAMENT MODE</text>
  <text x="104" y="190" fill="#F8FAFC" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">Liga App Mundial</text>
  <text x="104" y="248" fill="#B8C4D9" font-family="Inter, Segoe UI, sans-serif" font-size="28" font-weight="500">World Cup 2026 Pick'em entre amigos</text>
  <text x="104" y="304" fill="#E2E8F0" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="600">Auth, predicciones, sync real, locks, scoring idempotente y ranking final.</text>

  <g>
    <rect x="104" y="360" width="242" height="118" rx="24" fill="#111C31"/>
    <rect x="104.75" y="360.75" width="240.5" height="116.5" rx="23.25" stroke="#2A3957" stroke-width="1.5"/>
    <text x="128" y="410" fill="#00D9FF" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="42" font-weight="800">599</text>
    <text x="128" y="448" fill="#AEB9CC" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="2">POINT ROWS</text>
  </g>
  <g>
    <rect x="372" y="360" width="242" height="118" rx="24" fill="#111C31"/>
    <rect x="372.75" y="360.75" width="240.5" height="116.5" rx="23.25" stroke="#2A3957" stroke-width="1.5"/>
    <text x="396" y="410" fill="#F59E0B" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="42" font-weight="800">1624</text>
    <text x="396" y="448" fill="#AEB9CC" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="700" letter-spacing="2">POINTS AWARDED</text>
  </g>

  <g>
    <rect x="706" y="164" width="370" height="314" rx="30" fill="#111C31"/>
    <rect x="706.75" y="164.75" width="368.5" height="312.5" rx="29.25" stroke="#2A3957" stroke-width="1.5"/>
    <text x="742" y="216" fill="#C9D7F2" font-family="Inter, Segoe UI, sans-serif" font-size="17" font-weight="800" letter-spacing="3">FINAL PODIUM</text>
    <text x="742" y="284" fill="#FDE68A" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="46" font-weight="800">1. Pablin Yamal</text>
    <text x="1000" y="284" fill="#F8FAFC" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="36" font-weight="800" text-anchor="end">255</text>
    <text x="742" y="340" fill="#CBD5E1" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="34" font-weight="800">2. Berni</text>
    <text x="1000" y="340" fill="#F8FAFC" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="30" font-weight="800" text-anchor="end">248</text>
    <text x="742" y="392" fill="#FDBA74" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="34" font-weight="800">3. Petiit</text>
    <text x="1000" y="392" fill="#F8FAFC" font-family="Space Grotesk, Segoe UI, sans-serif" font-size="30" font-weight="800" text-anchor="end">245</text>
    <rect x="742" y="424" width="324" height="34" rx="17" fill="url(#pill)" fill-opacity="0.18"/>
    <text x="904" y="447" fill="#E0F7FF" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1.5">ARCHIVED FINAL STATE</text>
  </g>

  <text x="104" y="530" fill="#71809A" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="600">Next.js 16 · Supabase · Vercel · GitHub Actions · Vitest · Football-data</text>
</svg>
