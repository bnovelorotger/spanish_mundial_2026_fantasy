name: Sync World Cup Data

on:
  workflow_dispatch:
  schedule:
    # Live scoring needs fresher standings: 24 runs/day x 3 football-data calls
    # = 72 calls/day, safely below TIER_ONE (10 calls/minute, no daily cap).
    # GitHub scheduled runs can lag 5-30 min, so perceived ranking latency is
    # roughly <= 1h30 without increasing API noise further.
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export critical Supabase tables before sync
        id: backup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0

          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error title=Missing NEXT_PUBLIC_SUPABASE_URL::Add NEXT_PUBLIC_SUPABASE_URL as a repository secret so sync can create a rollback artifact before mutating data."
            missing=1
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error title=Missing SUPABASE_SERVICE_ROLE_KEY::Add SUPABASE_SERVICE_ROLE_KEY as a repository secret so sync can create a rollback artifact before mutating data."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          pnpm backup:critical

      - name: Upload pre-sync critical data artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: ${{ steps.backup.outputs.artifact_path }}
          retention-days: 30

      - name: Trigger protected sync endpoint
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=0

          if [ -z "$APP_URL" ]; then
            echo "::error title=Missing APP_URL::Add APP_URL as a repository variable or secret with your deployed app URL."
            missing=1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::error title=Missing CRON_SECRET::Add CRON_SECRET as a repository secret. It must match the Vercel CRON_SECRET."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          APP_URL="${APP_URL%/}"

          curl \
            --fail-with-body \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            "$APP_URL/api/sync"
