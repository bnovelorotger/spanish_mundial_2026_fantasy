name: Sync World Cup Data

on:
  workflow_dispatch:
  schedule:
    # Live scoring needs fresher standings: 24 runs/day x 3 football-data calls
    # = 72 calls/day, safely below TIER_ONE (10 calls/minute, no daily cap).
    # GitHub scheduled runs can lag 5-30 min, so perceived ranking latency is
    # roughly <= 1h30 without increasing API noise further.
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export critical Supabase tables before sync
        id: backup
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0

          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::error title=Missing NEXT_PUBLIC_SUPABASE_URL::Add NEXT_PUBLIC_SUPABASE_URL as a repository secret so sync can create a rollback artifact before mutating data."
            missing=1
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error title=Missing SUPABASE_SERVICE_ROLE_KEY::Add SUPABASE_SERVICE_ROLE_KEY as a repository secret so sync can create a rollback artifact before mutating data."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          pnpm backup:critical

      - name: Upload pre-sync critical data artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: ${{ steps.backup.outputs.artifact_path }}
          retention-days: 30

      - name: Run World Cup sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WORLD_CUP_API_PROVIDER: footballdata
          WORLD_CUP_API_KEY: ${{ secrets.WORLD_CUP_API_KEY }}
        run: |
          # Run the sync directly against Supabase using the repository's current
          # code, instead of calling the deployed /api/sync. This decouples
          # scheduled scoring from the Vercel deployment so a blocked or stale
          # deploy can no longer stop match-by-match updates.
          missing=0

          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error title=Missing Supabase credentials::Set NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY as repository secrets."
            missing=1
          fi

          if [ -z "$WORLD_CUP_API_KEY" ]; then
            echo "::error title=Missing WORLD_CUP_API_KEY::Add WORLD_CUP_API_KEY as a repository secret so the sync can reach the football-data provider."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          pnpm sync
